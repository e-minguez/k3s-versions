name: Publish to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron:  '56 * * * *'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-json:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.run.outputs.CHANGED }}
      frontend: ${{ steps.changes.outputs.frontend }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - uses: dorny/paths-filter@v4
      id: changes
      with:
        # No base: on a push, paths-filter compares against the commit the push
        # started from. Setting base: HEAD compared the pushed commit against
        # itself, so the diff was always empty and this filter never fired.
        filters: |
          frontend:
            - 'frontend/**'
            - '.github/workflows/main.yaml'

    # Cache versions.json so it doesn't update the site if there are no changes
    - name: versions.json cache
      uses: actions/cache@v6
      env:
        cache-name: cache-versions-json
      with:
        path: "k3s-versions.json"
        key: ${{ env.cache-name }}-${{ hashFiles('**/k3s-versions.json') }}
        restore-keys: ${{ env.cache-name }}-

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'
        cache: 'pip'

    - name: Invalidate versions.json cache if frontend changed
      if: steps.changes.outputs.frontend == 'true'
      run: |
        rm -f k3s-versions.json

    - name: Run k3s-versions
      id: run
      run: |
        pip install -r requirements.txt
        python k3s-versions.py | tee "${GITHUB_OUTPUT}"

    - name: Upload artifacts
      if: steps.run.outputs.CHANGED == 'true'
      uses: actions/upload-artifact@v7
      with:
        path: data/
        name: k3s-versions

  # Build the site with the same Node and the same locked dependency tree
  # that ci.yaml verifies on pull requests.
  build-ui:
    if: |
      needs.build-json.outputs.CHANGED == 'true' ||
      needs.build-json.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    needs: build-json
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # enablement switches the Pages source from the legacy gh-pages branch
      # to Actions on the first successful run.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Download json from build-json job
        uses: actions/download-artifact@v8
        with:
          name: k3s-versions
          path: data/

      - name: Copy the json file to the static gatsby folder
        run: |
          mkdir -p ./static/
          cp ../data/k3s.json ./static/
          ls ./static/

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -- --prefix-paths

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/public

  deploy:
    runs-on: ubuntu-latest
    needs: build-ui
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
